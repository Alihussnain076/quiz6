name: Validation CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validation-job:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify Repository Files
      run: |
        echo "Checking uploaded validation documents..."

        ls

        test -f README.md
        test -f "Validation Checklist Template.xlsx"
        test -f functional-validation.xlsx
        test -f zaptask.docx

        echo "All required files found successfully."

    - name: Generate Validation Logs
      run: |
        mkdir validation-logs

        echo "Validation Execution Report" > validation-logs/report.txt
        echo "Validation completed successfully." >> validation-logs/report.txt
        echo "Execution Date: $(date)" >> validation-logs/report.txt

    - name: Upload Validation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validation-evidence
        path: validation-logs/
